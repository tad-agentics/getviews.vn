# Build getviews-pipeline image on Cloud Build (push to main or manual).
# Deploy separately: SKIP_BUILD=1 ./cloud-run/deploy.sh batch|user|both
# Setup: cloud-run/docs/ci-cloud-run-build.md

name: Cloud Run — build image

on:
  push:
    branches: [main]
    paths:
      - "cloud-run/**"
      - "supabase/migrations/20260510000004_two_axis_niche_pr1_schema.sql"
      - "supabase/migrations/20260516190000_hi16_carousel_format_axis_junction.sql"
      - "supabase/migrations/20260630000003_creator_niches_16_music_real_estate.sql"
      - ".dockerignore"
      - ".gcloudignore"
      - "cloud-run/cloudbuild.yaml"
      - "cloud-run/Dockerfile"
  workflow_dispatch:

concurrency:
  group: cloud-run-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Cloud Build (repo root → gcr.io)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/getviews-pipeline
        run: |
          set -euo pipefail
          if [[ -z "${PROJECT_ID}" ]]; then
            echo "::error::Set GCP_WIF_* + GCP_PROJECT_ID secrets. See cloud-run/docs/ci-cloud-run-build.md"
            exit 1
          fi
          BUILD_ID="$(gcloud builds submit \
            --project "$PROJECT_ID" \
            --config=cloud-run/cloudbuild.yaml \
            --substitutions="_TAG=${IMAGE},_TAG_SHA=${IMAGE}:${GITHUB_SHA}" \
            --async \
            --format='value(id)' \
            .)"
          echo "Cloud Build ID: ${BUILD_ID}"
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            STATUS="$(gcloud builds describe "${BUILD_ID}" --project "${PROJECT_ID}" --format='value(status)')"
            echo "Status: ${STATUS}"
            case "${STATUS}" in
              SUCCESS) break ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::Cloud Build ${BUILD_ID} finished with status ${STATUS}"
                exit 1
                ;;
              QUEUED|WORKING|PENDING|STATUS_UNKNOWN)
                if (( $(date +%s) > deadline )); then
                  echo "::error::Timed out waiting for Cloud Build ${BUILD_ID}"
                  exit 1
                fi
                sleep 15
                ;;
              *)
                echo "::error::Unexpected Cloud Build status: ${STATUS}"
                exit 1
                ;;
            esac
          done

      - name: Summary
        env:
          IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/getviews-pipeline
        run: |
          echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}\` (tag \`latest\` from cloudbuild)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy without rebuild:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "SKIP_BUILD=1 ./cloud-run/deploy.sh both" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
