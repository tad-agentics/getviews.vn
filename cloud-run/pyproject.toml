[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getviews-pipeline"
version = "0.1.0"
description = "GetViews.vn Cloud Run analysis pipeline (EnsembleData + Gemini + Supabase)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "google-genai>=0.8.0",
  "google-cloud-speech>=2.26.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "aiofiles>=24.0",
  "supabase>=2.0.0",
  "boto3>=1.34.0",
  "langdetect>=1.0.9",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-httpx>=0.45b0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23.0",
]
# Phase D.6.4 — /admin/logs panel. Optional so the base image stays lean
# for deploys that don't use the log-fetch feature. To enable:
#   1. Install with `pip install -e ".[logs]"` (or bake into Dockerfile).
#   2. Set ADMIN_LOGS_ENABLED=true on the Cloud Run service.
#   3. Grant the Cloud Run service account roles/logging.viewer (or mount
#      a dedicated SA JSON via GOOGLE_APPLICATION_CREDENTIALS).
logs = [
  "google-cloud-logging>=3.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["getviews_pipeline"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long embedded Gemini prompts, Vietnamese regex, and log-format strings.
"getviews_pipeline/prompts.py" = ["E501"]
"getviews_pipeline/output_redesign.py" = ["E501"]
"getviews_pipeline/layer0_prompts.py" = ["E501"]
"getviews_pipeline/voice_guide.py" = ["E501"]
"getviews_pipeline/knowledge_base.py" = ["E501"]
"getviews_pipeline/morning_ritual.py" = ["E501"]
"getviews_pipeline/settings.py" = ["E501"]
"getviews_pipeline/gemini.py" = ["E501"]
"getviews_pipeline/pipelines.py" = ["E501"]
"getviews_pipeline/script_generate.py" = ["E501"]
"getviews_pipeline/pattern_deck_synth.py" = ["E501"]
"getviews_pipeline/diagnose_prompts.py" = ["E501"]
"getviews_pipeline/douyin_patterns_synth.py" = ["E501"]
"getviews_pipeline/douyin_synth.py" = ["E501"]
"getviews_pipeline/douyin_translator.py" = ["E501"]
"getviews_pipeline/report_diagnostic_gemini.py" = ["E501"]
"getviews_pipeline/report_ideas.py" = ["E501"]
"getviews_pipeline/report_ideas_gemini.py" = ["E501"]
"getviews_pipeline/report_lifecycle_gemini.py" = ["E501"]
"getviews_pipeline/report_pattern.py" = ["E501"]
"getviews_pipeline/report_pattern_gemini.py" = ["E501"]
"getviews_pipeline/report_timing_gemini.py" = ["E501"]
"getviews_pipeline/routers/admin.py" = ["E501"]
"getviews_pipeline/routers/answer.py" = ["E501"]
"getviews_pipeline/routers/home.py" = ["E501"]
"getviews_pipeline/routers/intent.py" = ["E501"]
"getviews_pipeline/routers/script.py" = ["E501"]
"getviews_pipeline/routers/video.py" = ["E501"]
"getviews_pipeline/services/extraction.py" = ["E501"]
"getviews_pipeline/signals/distribution.py" = ["E501"]
# Test fixtures mirror production payloads; keep line-length checks off.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "no_creator_stub: opt out of the autouse build_creator_comparison stub",
]
